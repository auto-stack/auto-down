[package]
name = "jade-garden-back"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
auto-lang = { path = "D:/autostack/auto-lang/crates/auto-lang" }
# PLAN-013 T-06 前置修复:base64 自 dev-dependencies 归位——vm_dispatch
# b64_encode/b64_decode 为生产 fn(Plan 058 信封三路由消费),原 058 提交时
# 仅测试消费故落 dev-deps,提升为生产代码后未随迁 → 生产 import E0432。
base64 = "0.22"
chrono = "0.4.45"
lazy_static = "1.5.0"
notify = "8.2.0"
rand = "0.9.0"
# regex removed in plan-022 Phase 5 (last consumer retired to unlinked.at)
# regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.16.0", features = ["v4"] }
walkdir = "2.5.0"
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.14.0"
